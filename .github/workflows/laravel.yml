name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis
          coverage: pcov

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      # --- Static Analysis ---
      - name: Run Larastan (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run Pint (formatting check)
        run: vendor/bin/pint --test

      # --- Tests with Coverage ---
      - name: Run tests (incl. architecture guards)
        run: php -d pcov.directory=$(pwd)/app artisan test --coverage --coverage-html=coverage-report --min=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      # --- Frontend Build ---
      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend assets
        run: npm run build

      # --- Deploy Gate ---
      - name: Check pending migrations
        run: |
          PENDING=$(php artisan migrate:status --pending 2>/dev/null | grep -c "Pending" || true)
          if [ "$PENDING" -gt 0 ]; then
            echo "FAIL: $PENDING pending migrations, deploy blocked"
            php artisan migrate:status --pending
            exit 1
          fi
          echo "OK: No pending migrations"
