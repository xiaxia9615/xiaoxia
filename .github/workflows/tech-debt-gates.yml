# 技术债治理门禁（密钥扫描）
# 覆盖率门禁已统一由 laravel.yml 负责（--min=40），此处不重复，避免配置漂移
# 原型位于 /home/ubuntu/.github/workflows/tech-debt-gates.yml（占位版），
# 本文件为填充实际命令后的生效版本。
name: tech-debt-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: 门禁1-密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 secretlint
        run: npm install -g secretlint @secretlint/secretlint-rule-preset-recommend
      - name: 扫描私钥/Token/密码
        run: secretlint "**/*"
